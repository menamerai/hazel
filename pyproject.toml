[tool.poetry]
name = "hazel"
version = "0.1.0"
description = "Discord bot for Future of Data Hackathon"
authors = ["menamerai <rphananh@gmail.com>"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
"discord.py" = "^2.3.2"
pre-commit = "^3.7.1"
pytest = "^8.2.2"
python-dotenv = "^1.0.1"
supabase = "^2.5.1"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.isort]
profile = "black"
